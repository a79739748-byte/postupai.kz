<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поступай KZ — Калькулятор и выбор ВУЗа</title>
    
    <!-- Запрет кэширования старых версий -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Подключение стилей и скриптов с версией v=3 -->
    <link rel="stylesheet" href="style.css?v=3">
    <script src="script.js?v=3" defer></script>
</head>
<body>

    <div class="container">
        <!-- Языковой переключатель -->
        <div class="lang-switch">
            <button onclick="changeLanguage('ru')" id="btn-ru" class="active">РУС</button>
            <button onclick="changeLanguage('kz')" id="btn-kz">ҚАЗ</button>
            <button onclick="changeLanguage('en')" id="btn-en">ENG</button>
        </div>

        <header>
            <h1 id="txt-title">Поступай KZ 🎓</h1>
            <p id="txt-subtitle">Рассчитай свои шансы на грант в ВУЗы Казахстана</p>
        </header>

        <main>
            <div class="calculator-card">
                <!-- Выбор комбинации предметов -->
                <div class="form-group">
                    <label for="subjects" id="lbl-subjects">Комбинация предметов:</label>
                    <select id="subjects">
                        <option value="phys-math" id="opt-phys-math">Физика + Математика</option>
                        <option value="math-info" id="opt-math-info">Математика + Информатика</option>
                        <option value="chem-bio" id="opt-chem-bio">Химия + Биология</option>
                        <option value="bio-geo" id="opt-bio-geo">Биология + География</option>
                        <option value="geo-math" id="opt-geo-math">География + Математика</option>
                        <option value="geo-lang" id="opt-geo-lang">География + Иностранный язык</option>
                        <option value="hist-lang" id="opt-hist-lang">Всемирная история + Иностранный язык</option>
                        <option value="hist-law" id="opt-hist-law">Всемирная история + Основы права</option>
                        <option value="hist-geo" id="opt-hist-geo">Всемирная история + География</option>
                        <option value="lang-lit" id="opt-lang-lit">Язык + Литература</option>
                        <option value="chem-phys" id="opt-chem-phys">Химия + Физика</option>
                        <option value="creative" id="opt-creative">Творческий экзамен</option>
                    </select>
                </div>

                <!-- Ввод балла ЕНТ -->
                <div class="form-group">
                    <label for="score" id="lbl-score">Твой балл ЕНТ:</label>
                    <input type="number" id="score" placeholder="Например: 110" min="0" max="140">
                </div>

                <!-- Фильтры инфраструктуры -->
                <div class="filters-group">
                    <label><input type="checkbox" id="dormitory"> <span id="lbl-dormitory">Наличие общежития</span></label>
                    <label><input type="checkbox" id="military"> <span id="lbl-military">Военная кафедра</span></label>
                </div>

                <!-- Кнопка расчета -->
                <button onclick="calculateChances()" id="btn-calc">Рассчитать шансы</button>
            </div>

            <!-- Блок результатов -->
            <div id="results" class="results-container"></div>
        </main>

        <footer>
            <p>© 2026 Поступай KZ. Все права защищены.</p>
        </footer>
    </div>

</body>
</html>
