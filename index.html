<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поступай KZ — Калькулятор шансов и поиск ВУЗов Казахстана</title>
    
    <!-- Подтверждение Google Search Console -->
    <meta name="google-site-verification" content="v_qE13_4I6iHO4actouf1DeoCIwjNW5HT1ld0wz6t7s" />

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Поступай KZ</h1>
            <p>Подбор ВУЗов и калькулятор шансов поступления на грант</p>
        </div>
    </header>

    <main class="container">
        <section class="calculator-card">
            <h2>Расчёт шансов на грант ЕНТ</h2>
            
            <div class="form-group">
                <label for="score">Ваш балл ЕНТ:</label>
                <input type="number" id="score" placeholder="Например: 110" min="0" max="140">
            </div>

            <div class="form-group">
                <label for="direction">Профильные предметы / Направление:</label>
                <select id="direction">
                    <option value="">-- Выберите профиль --</option>
                    <option value="fizmat">Физика - Математика</option>
                    <option value="mat-inf">Математика - Информатика</option>
                    <option value="eng">Иностранный язык - История</option>
                    <option value="geo">География - Математика</option>
                    <option value="creative">Творческий экзамен</option>
                </select>
            </div>

            <button onclick="calculateChances()">Рассчитать шансы</button>

            <div id="resultBlock" class="result-block">
                Введите данные и нажмите «Рассчитать шансы»
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Поступай KZ. Все права защищены.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
